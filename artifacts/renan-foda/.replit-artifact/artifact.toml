kind = "web"
previewPath = "/"
title = "renan.foda — IA de Sinais IQ Option"
version = "1.0.0"
id = "artifacts/renan-foda"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20161

[services.development]
run = "pnpm --filter @workspace/renan-foda run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/renan-foda", "run", "build" ]
publicDir = "artifacts/renan-foda/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20161"
BASE_PATH = "/"
